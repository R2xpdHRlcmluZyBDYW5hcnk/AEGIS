<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 AEGIS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#121212;--surface:#1e1e1e;--line:#484848;--muted:#b3b3b3;--text:#e0e0e0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:14px/1.5 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{width:min(400px,calc(100vw - 32px));padding:32px;border:1px solid #303030;border-radius:3px;background:var(--surface);box-shadow:0 2px 6px #00000040}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brand-icon{width:40px;height:40px;flex:none}
.mark{color:var(--muted);font:600 20px Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
label{display:block;margin:16px 0 6px;font-size:12px;color:var(--muted)}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid #7eabd0;outline-offset:2px}
button{margin-top:22px;width:100%;padding:9px 12px;border:1px solid #61865e;border-radius:2px;background:#477a4b;
  color:#fff;font:inherit;cursor:pointer}
button:hover:not(:disabled){background:#4c8050}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{margin:0;padding:9px 11px;font-size:12px;border:1px solid #8d5151;background:#432c2c;color:#e8a0a0}
.foot{margin:20px 0 0;font-size:11px;color:var(--muted)}
</style></head>
<body><form class="card" method="post" action="/login" autocomplete="on">
<div class="brand"><img class="brand-icon" src="/favicon.svg" alt=""><div class="mark">NDR CONSOLE</div></div>
{{if .Message}}<p class="msg" role="alert">{{.Message}}</p>{{end}}
<label for="username">用户名</label>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
  spellcheck="false" required autofocus value="{{.User}}">
<label for="password">密码</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<input type="hidden" name="next" value="{{.Next}}">
<button type="submit"{{if .Disabled}} disabled{{end}}>登录</button>

</form></body></html>
