[Unit]
Requires=ips-rule-manager.service
After=ips-rule-manager.service

[Service]
DynamicUser=yes
SupplementaryGroups=ips-console
StateDirectory=ips-web
StateDirectoryMode=0700
RuntimeDirectory=ips-web-overview
RuntimeDirectoryMode=0700
LoadCredential=ips-web.conf:/etc/ips-web.conf
ExecStart=
ExecStart=/usr/local/bin/ips-web --config %d/ips-web.conf
Environment=IPS_WEB_ISOLATED=1
ProtectSystem=strict
ReadWritePaths=
ReadOnlyPaths=/var/log/ips
InaccessiblePaths=/etc/snort /var/lib/snort -/run/snort /var/lib/ips-rule-manager
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
LockPersonality=yes
